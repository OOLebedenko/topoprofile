[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "topoprofile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas==1.1.4",
    "mapbox-vector-tile==2.2.0",
    "osm2geojson==1.0.0rc1",
    "pillow==12.3.0",
    "pygmt==0.19.0",
    "rasterio==1.5.1",
    "rio-rgbify==0.4.0",
    "rioxarray==0.23.0",
    "requests==2.34.2",
    "tqdm==4.70.0",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "ruff",
    "types-geopandas",
    "types-shapely",
    "types-rasterio",
    "types-tqdm",
]

[tool.setuptools.packages.find]
include = ["topoprofile*"]
namespaces = false

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "mapbox_vector_tile",
    "mapbox_vector_tile.*",
    "pygmt",
    "pygmt.*",
    "rio_rgbify",
    "rio_rgbify.*",
]
ignore_missing_imports = true
